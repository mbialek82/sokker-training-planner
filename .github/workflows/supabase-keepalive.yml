# supabase-keepalive.yml — v1
# Location in repo: .github/workflows/supabase-keepalive.yml
#
# Purpose: keep the free-tier Supabase project "soker" (ahyxijjqzxnypbmavgrr)
# from being auto-paused after 7 days of inactivity.
#
# What it does: every 3 days, one read-only GET against the `submissions`
# table via the REST API, using the anon key. Nothing is written.
# With INSERT-only RLS the response is an empty list, but the request still
# reaches the database, which counts as activity.
#
# Setup: add repo secret SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → New repository secret),
# value = the same anon key the planner uses.
#
# Changelog
#   v1 (2026-11-11): initial version.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"   # 06:17 UTC on every 3rd day of the month
  workflow_dispatch: {}       # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only query to Supabase
        env:
          SUPABASE_URL: https://ahyxijjqzxnypbmavgrr.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/submissions?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat response.txt
          # Fail the run (and trigger GitHub's failure email) if the project
          # is unreachable, e.g. already paused or the key is wrong.
          if [ "$status" -ge 400 ]; then exit 1; fi
